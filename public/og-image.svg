  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Color Boxes -->
  <rect x="340" y="180" width="60" height="60" rx="12" fill="#ef4444"/>
  <rect x="410" y="180" width="60" height="60" rx="12" fill="#f59e0b"/>
  <rect x="480" y="180" width="60" height="60" rx="12" fill="#10b981"/>
