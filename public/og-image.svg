  <rect x="620" y="180" width="60" height="60" rx="12" fill="#8b5cf6"/>
  <rect x="690" y="180" width="60" height="60" rx="12" fill="#ec4899"/>

  <!-- Title -->
  <text x="600" y="320" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle">
